<!DOCTYPE html>
<html data-theme="light">

<head>
    <link href="css/tailwind.min.css" rel="stylesheet">
</head>

<body style="padding: 1em;">
    <h3 id="scionsupport" class="text-lg text-left font-bold mb-3 mt-3"></h3>
    <div id="domainlist" class="w-100 mb-4"></div>
    <hr/>

    <div class="flex justify-center mb-2" id="scionModePreference">
        <label for="toogleA" class="flex items-center cursor-pointer">
            <div id="maindomain" class="mr-3 text-gray-700 font-medium text-sm ">

            </div>
            <div class="flex flex-col" style="width: 95px;" class="items-center">
                <!-- toggle -->
                <div class="relative" id="togglePerSiteStrictModeContainer" style="margin: auto;">
                    <!-- input -->
                    <input id="togglePerSiteStrictMode" type="checkbox" class="sr-only"/>
                    <!-- line -->
                    <div id="lineRunning" class="w-8 h-5 bg-gray-400 rounded-full shadow-inner"></div>
                    <!-- dot -->
                    <div class="dot absolute w-5 h-5 bg-white rounded-full shadow -left-1 -top-0 transition"></div>
                </div>
                <span id="scionmode" style="font-size: 11px; text-align: center;"></span>
            </div>
            <!-- label -->
        </label>
    </div>
    <hr/>

    <div class="flex">
        <button class="px-2 py-1 rounded-md text-sm font-medium border-0 focus:outline-none focus:ring transition text-blue-600 hover:text-blue-800 active:bg-blue-200 focus:ring-blue-300"
                id="button-options">
            Manage Preferences...
        </button>
    </div>
    <hr/>

    <div class="ac">
        <input class="ac-input" id="ac-1" name="ac-1" type="checkbox"/>
        <label id="ac-label-main"
               class="ac-label text-sm font-medium border-0 focus:outline-none focus:ring transition text-blue-600 hover:text-blue-800 active:bg-blue-200 focus:ring-blue-300"
               for="ac-1">Path Usage...</label>
        <article class="ac-text" id="path-usage-container"></article>
    </div>

    <hr/>

    <div id="proxy-container" role="alert" class="card alert bg-gray-300 p-0">
        <div class="collapse collapse-arrow">
            <input type="checkbox"/>
            <div class="collapse-title flex">
                <svg xmlns="http://www.w3.org/2000/svg"
                     fill="none"
                     viewBox="0 0 24 24"
                     class="stroke-info h-6 w-6 shrink-0"
                     id="proxy-icon-0">
                    <path stroke-linecap="round"
                          stroke-linejoin="round"
                          stroke-width="2"
                          d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <svg xmlns="http://www.w3.org/2000/svg"
                     class="h-6 w-6 shrink-0 stroke-current hidden"
                     fill="none"
                     viewBox="0 0 24 24"
                     id="proxy-icon-1">
                    <path stroke-linecap="round"
                          stroke-linejoin="round"
                          stroke-width="2"
                          d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                <svg xmlns="http://www.w3.org/2000/svg"
                     class="h-6 w-6 shrink-0 stroke-current hidden"
                     fill="none"
                     viewBox="0 0 24 24"
                     id="proxy-icon-2">
                    <path stroke-linecap="round"
                          stroke-linejoin="round"
                          stroke-width="2"
                          d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                </svg>
                <svg xmlns="http://www.w3.org/2000/svg"
                     class="h-6 w-6 shrink-0 stroke-current hidden"
                     fill="none"
                     viewBox="0 0 24 24"
                     id="proxy-icon-3">
                    <path stroke-linecap="round"
                          stroke-linejoin="round"
                          stroke-width="2"
                          d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                <span id="proxy-status-message" class="ml-3 h-fit">Connected to proxy via HTTPS</span>
            </div>
            <div class="collapse-content">
                <p id="proxy-details-content">Proxy at https://forward-proxy.scion:9443</p>
                <a id="proxy-help-link" href="#" class="text-blue-600 hover:text-blue-800 hidden">Need Help?</a>
            </div>
        </div>
    </div>

    <script type="module" src="vendor/browser-polyfill.js"></script>
    <script type="module" src="shared/storage.js"></script>
    <script type="module" src="popup.js"></script>
</body>

</html>
