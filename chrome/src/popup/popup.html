<!DOCTYPE html>
<html data-theme="light" lang="en">

<head>
    <link href="../../css/tailwind.min.css" rel="stylesheet">
    <title>Popup</title>
</head>

<body class="p-4 min-w-max" style="font-size: 100%">
    <h1 class="pb-4 font-semibold" style="font-size: x-large;">SCION Extension Information</h1>

    <div role="tablist" class="tabs tabs-lifted" id="popup-tab-list">
        <input id="tab-options" type="radio" name="main_tabs" role="tab" class="tab" aria-label="Options" checked/>
        <div role="tabpanel" aria-labelledby="tab-options" class="tab-content bg-transparent border-black rounded-box p-5">
            <div class="flex justify-start mb-2 items-center" id="togglePerSiteContainer">
                <label class="mr-12" for="togglePerSiteCheckbox">
                    SCION Preference for
                    <span id="togglePerSiteMainDomain" class="font-bold">
                        <!-- The contents of this element are generated by TS -->
                    </span>
                </label>
                <!-- TODO: possibly, in TS the aria label for this should be changed, such that it contains the text from the next <p></p> to better convey the current status of the toggle -->
                <input type="checkbox" class="toggle toggle-success flex" id="togglePerSiteCheckbox"/>
                <p id="togglePerSiteMode" class="text-center self-center ml-2" style="font-size: 11px;">
                    <!-- The contents of this element are generated by TS -->
                </p>
            </div>

            <div class="flex mb-4 pb-2 pt-2">
                <button class="btn btn-active" id="openOptionsButton">Manage Preferences</button>
            </div>

            <div class="w-96">
                <div id="proxyContainer" role="alert" class="card alert alert-success p-0">
                    <div class="collapse collapse-arrow">
                        <input id="collapse-proxy-status" type="checkbox"/>
                        <div class="collapse-title flex items-center">
                            <!-- The SVGs of the following icons were directly taken from the DaisyUI docs: -->
                            <!-- https://v4.daisyui.com/components/alert/ -->
                            <svg xmlns="http://www.w3.org/2000/svg"
                                 fill="none"
                                 viewBox="0 0 24 24"
                                 class="stroke-info h-6 w-6 shrink-0 hidden"
                                 id="proxy-icon-0">
                                <path stroke-linecap="round"
                                      stroke-linejoin="round"
                                      stroke-width="2"
                                      d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                            <svg xmlns="http://www.w3.org/2000/svg"
                                 class="h-6 w-6 shrink-0 stroke-current"
                                 fill="none"
                                 viewBox="0 0 24 24"
                                 id="proxy-icon-1">
                                <path stroke-linecap="round"
                                      stroke-linejoin="round"
                                      stroke-width="2"
                                      d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                            </svg>
                            <svg xmlns="http://www.w3.org/2000/svg"
                                 class="h-6 w-6 shrink-0 stroke-current hidden"
                                 fill="none"
                                 viewBox="0 0 24 24"
                                 id="proxy-icon-2">
                                <path stroke-linecap="round"
                                      stroke-linejoin="round"
                                      stroke-width="2"
                                      d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                            </svg>
                            <svg xmlns="http://www.w3.org/2000/svg"
                                 class="h-6 w-6 shrink-0 stroke-current hidden"
                                 fill="none"
                                 viewBox="0 0 24 24"
                                 id="proxy-icon-3">
                                <path stroke-linecap="round"
                                      stroke-linejoin="round"
                                      stroke-width="2"
                                      d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                            </svg>
                            <label for="collapse-proxy-status" id="proxyStatusMessage" class="ml-3 h-fit">
                                <!-- The contents of this element are generated by TS -->
                            </label>
                        </div>
                        <div class="collapse-content text-left">
                            <p id="proxyDetailsContent" style="font-size: 75%;">
                                <!-- The contents of this element are generated by TS -->
                            </p>
                            <a id="proxyHelpLink" href="#" class="text-blue-600 hover:text-blue-800 hidden">Need Help?</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <input id="tab-website-information" type="radio" name="main_tabs" role="tab" class="tab" aria-label="Website Information"/>
        <div role="tabpanel" aria-labelledby="tab-website-information" class="tab-content bg-transparent border-black rounded-box p-5">
            <h2 id="popupTitle" class="text-lg text-left font-bold mb-3">
                <!-- The contents of this element are generated by TS -->
            </h2>
            <div id="domainlist" class="mb-4 flex flex-col space-y-1">
                <!-- The contents of this element are generated by TS -->
            </div>

            <div class="w-96">

                <div class="collapse collapse-arrow bg-default mb-4">
                    <input id="collapse-general-routing" type="checkbox"/>
                    <label for="collapse-general-routing" class="collapse-title font-medium content-center">General Routing Info</label>
                    <div class="collapse-content space-y-2 text-sm">
                        <div><p class="font-bold">Site: </p>
                            <span id="pathUsageSite">
                                <!-- The contents of this element are generated by TS -->
                            </span>
                        </div>
                        <div>
                            <p class="font-bold">Strategy: </p>
                            <span id="pathUsageStrategy">
                                <!-- The contents of this element are generated by TS -->
                            </span>
                        </div>
                        <div>
                            <p class="font-bold mb-1">ISDs: </p>
                            <div id="pathUsageISDs" class="flex flex-col space-y-1">
                                <!-- The contents of this element are generated by TS -->
                            </div>
                        </div>
                    </div>
                </div>

                <div class="collapse collapse-arrow bg-default">
                    <input id="collapse-path-taken" type="checkbox"/>
                    <label for="collapse-path-taken" class="collapse-title font-medium content-center">Path Taken</label>
                    <div id="pathUsagePath" class="collapse-content space-y-2 text-sm">
                        <!-- The contents of this element are generated by TS -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="../shared/storage.js"></script>
    <script type="module" src="popup.js"></script>
</body>

</html>
