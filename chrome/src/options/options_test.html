<!DOCTYPE html>
<html>

<head>
    <link href="../../css/tailwind.min.css" rel="stylesheet">

    <style>
        body {
            --new-widget-bg: rgb(209 213 219);
            --table-zebra-new-row-bg: rgb(209 213 219 / 0.25);
        }

        #options-tab-list > .tab:is(input:checked) {
            background-color: var(--new-widget-bg) !important;
        }

        #options-tab-list > .tab:is(input:checked):before {
            --tab-bg: var(--new-widget-bg) !important;
        }

        #options-tab-list > .tab {
            --tab-border-color: #000000 !important;
        }

        .font-body {
            font-size: 12px;
        }

        .bg-default {
            background-color: var(--new-widget-bg);
        }

        #site-preferences-table tbody tr:nth-child(2n) td:first-child {
            background-color: var(--table-zebra-new-row-bg);
            border-start-start-radius: var(--rounded-box, 1rem);
            border-end-start-radius: var(--rounded-box, 1rem);
        }

        #site-preferences-table tbody tr:nth-child(2n) td:last-child {
            background-color: var(--table-zebra-new-row-bg);
            border-start-end-radius: var(--rounded-box, 1rem);
            border-end-end-radius: var(--rounded-box, 1rem);
        }

        .label-strict {
            display: none;
        }
        .strict-mode-toggle:checked ~ .label-available {
            display: none;
        }
        .strict-mode-toggle:checked ~ .label-strict {
            display: block;
        }
        .strict-mode-toggle ~ label {
            min-width: 90px;
        }
    </style>
</head>

<body>
    <div class="w-full mx-auto p-2" style="width: 600px; height: 600px">
        <div role="tablist" class="tabs tabs-lifted" id="options-tab-list">
            <!-- General -->
            <input type="radio" name="main_tabs" role="tab" class="tab" aria-label="General"/>
            <div role="tabpanel" class="tab-content bg-transparent border-black rounded-box p-5">
                <div class="card bg-default">
                    <div class="card-body p-5">
                        <div class="title-row flex flex-row justify-between">
                            <h2 class="card-title">Global Strict Mode</h2>
                            <input type="checkbox" class="toggle toggle-success"/>
                        </div>
                        <div class="font-body">
                            Use SCION exclusively. Many sites will fail or only load partially.
                        </div>
                    </div>
                </div>
            </div>

            <!-- Site Preferences -->
            <input type="radio" name="main_tabs" role="tab" class="tab" aria-label="Site Preferences" checked/>
            <div role="tabpanel" class="tab-content bg-transparent border-black rounded-box p-5">
                <div class="font-body">Add a preference for a domain (including all requested cross-domain resources).</div>

                <div class="flex flex-row justify-between items-center my-4">
                    <input type="text" placeholder="Enter domain" class="input input-bordered"/>
                    <div class="toggle-container flex flex-row items-center">
                        <input id="enter-domain-toggle" type="checkbox" class="strict-mode-toggle toggle toggle-success"/>
                        <label for="enter-domain-toggle" class="label-available ml-2 font-body cursor-pointer">When available</label>
                        <label for="enter-domain-toggle" class="label-strict ml-2 font-body cursor-pointer">Strict</label>
                    </div>
                    <button class="btn btn-active">Add</button>
                </div>

                <table class="table" id="site-preferences-table">
                    <!-- Header -->
                    <thead class="">
                        <tr>
                            <th class="bg-default rounded-s-box">Site</th>
                            <th class="bg-default rounded-e-box">Mode</th>
                        </tr>
                    </thead>

                    <!-- Body -->
                    <tbody>
                        <!-- The contents of this element are generated by TS -->
                        <tr>
                            <td>ethz.ch</td>
                            <td>
                                <div class="toggle-container flex flex-row items-center">
                                    <input id="table-domain-toggle-0" type="checkbox" class="strict-mode-toggle toggle toggle-success"/>
                                    <label for="table-domain-toggle-0" class="label-available ml-2 font-body cursor-pointer">When available</label>
                                    <label for="table-domain-toggle-0" class="label-strict ml-2 font-body cursor-pointer">Strict</label>
                                </div>
                            </td>
                        </tr>
                        <tr>
                            <td>example.com</td>
                            <td>
                                <div class="toggle-container flex flex-row items-center">
                                    <input id="table-domain-toggle-1" type="checkbox" class="strict-mode-toggle toggle toggle-success"/>
                                    <label for="table-domain-toggle-1" class="label-available ml-2 font-body cursor-pointer">When available</label>
                                    <label for="table-domain-toggle-1" class="label-strict ml-2 font-body cursor-pointer">Strict</label>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Geofencing -->
            <input type="radio" name="main_tabs" role="tab" class="tab" aria-label="Geofencing"/>
            <div role="tabpanel" class="tab-content bg-transparent border-black rounded-box p-5">
            </div>

            <!-- Advanced -->
            <input type="radio" name="main_tabs" role="tab" class="tab" aria-label="Advanced"/>
            <div role="tabpanel" class="tab-content bg-transparent border-black rounded-box p-5">
            </div>
        </div>
    </div>
</body>
<script type="module" src="../shared/storage.js"></script>
<script type="module" src="options.js"></script>

</html>
